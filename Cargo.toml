[package]
name        = "audio-viz"
version     = "0.1.0"
edition     = "2021"
description = "2D/3D windowed audio visualizer with GPU-shader and software rendering"
build       = "build.rs"

# audio-viz-tui/ (the legacy terminal app) is its own workspace and builds
# independently from inside that directory.
[workspace]
members = ["."]
exclude = ["audio-viz-tui"]

[[bin]]
name = "audio-viz"
path = "src/main.rs"

[dependencies]
winit      = "0.30"
wgpu       = "24"
egui       = "0.31"
egui-wgpu  = "0.31"
egui-winit = "0.31"
pollster   = "0.4"
bytemuck   = { version = "1", features = ["derive"] }
cpal       = { version = "0.15", default-features = false }
rustfft    = "6"
clap       = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
fontdue    = "0.9"
rand       = "0.8"

[profile.release]
opt-level = 3
lto       = true
